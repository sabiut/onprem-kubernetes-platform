---
# Configure everything Terraform created:
#   cd ansible && ansible-playbook playbooks/site.yml
- name: Base OS on every VM
  hosts: all
  become: true
  roles: [common]

- name: Database server
  hosts: dbservers
  become: true
  roles: [postgresql]

- name: Kubernetes control plane
  hosts: k3s_server
  become: true
  roles: [k3s_server]

- name: Kubernetes workers
  hosts: k3s_agents
  become: true
  roles: [k3s_agent]

- name: Check the cluster from this machine
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig_dest }} wait --for=condition=Ready nodes --all --timeout=180s
      changed_when: false

    - name: Show nodes
      ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig_dest }} get nodes -o wide
      register: nodes
      changed_when: false

    - name: Nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
