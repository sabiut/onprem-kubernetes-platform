{{- /* Only rendered when the Prometheus Operator CRDs exist (kube-prometheus-stack installed) */ -}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "webapp.name" . }}
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "webapp.selector" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
