apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.name" . }}
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "webapp.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9113
      targetPort: metrics
    {{- end }}
