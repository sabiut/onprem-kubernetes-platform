apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webapp.name" . }}-db
  labels: {{- include "webapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGHOST: {{ required "database.host is required" .Values.database.host | quote }}
  PGPORT: {{ .Values.database.port | quote }}
  PGDATABASE: {{ .Values.database.name | quote }}
  PGUSER: {{ .Values.database.user | quote }}
  PGPASSWORD: {{ required "database.password is required (--set database.password=...)" .Values.database.password | quote }}
  PGSSLMODE: {{ .Values.database.sslmode | quote }}
